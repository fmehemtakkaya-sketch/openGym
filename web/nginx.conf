# openGym — standalone web server: serves the static app AND proxies /api to the backend,
# so the whole app lives on ONE origin (required for WebAuthn / passkeys).
server {
    # Auf Dockup horchen alle Dienste auf Port 3000 (Hausstandard); die
    # Bereitschaftspruefung testet genau diesen Port. nginx horcht sonst auf 80.
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # API → api-Dienst (07.09.2026 wieder aktiviert)
    #
    # Ziel ist die interne Adresse des Dockup-Dienstes privat-repo/opengym-api.
    # Private Networking im Projekt ist aktiv, damit loest <slug>.internal auf.
    # Der Proxy MUSS hier durchlaufen: die Anmeldung nutzt Passkeys (WebAuthn),
    # die nur funktionieren, wenn Oberflaeche und Backend unter derselben
    # Adresse liegen. Der api-Dienst bekommt deshalb keine eigene oeffentliche
    # Adresse beworben; RP_ID/ORIGIN dort zeigen auf diese Domain.
    #
    # Upstream ueber Variable + resolver statt fest verdrahtet: bei einem festen
    # Namen bricht nginx beim Start ab, wenn der api-Dienst gerade nicht
    # aufloest ("host not found in upstream") — genau daran ist der Dienst
    # vorher gescheitert. So startet die Oberflaeche auch dann, der /api/-Pfad
    # antwortet dann eben mit 502 statt alles mitzureissen.
    # 127.0.0.11 ist der DNS des Container-Netzes (aus dem Container geprueft).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $opengym_api "opengym-api.internal:3000";

    location /api/ {
        # Ohne URI-Teil hinter der Variablen reicht nginx den urspruenglichen
        # Pfad unveraendert durch — der api-Dienst erwartet "/api/..." selbst.
        proxy_pass http://$opengym_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # App shell: always revalidate so updates show up immediately
    location ~* \.(js|css|json|html)$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Exercise images/GIFs never change → cache hard
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_vary on;
    gzip_min_length 1024;
}
